<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Ahmad Essam developer profile</title>
  <desc id="desc">Dark developer dashboard banner for Ahmad Essam, an AI, machine learning and full-stack developer.</desc>
  <defs>
